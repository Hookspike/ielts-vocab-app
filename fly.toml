# fly.toml app configuration file generated for ielts-vocab-app on 2026-06-08T15:11:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ielts-vocab-app'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 500
    soft_limit = 200

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
